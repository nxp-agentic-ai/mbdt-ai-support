# manifest.yaml -- Tooling metadata for inserting-mbdt-custom-code
schema_version: 1

license: LA_OPT_Online Code Hosting NXP_Software_License

scope: nxp-mbdt-cross-platform

version: "1.1.0"

matlab-release: ">=R2024b"

requires-tools:
  # evaluate_matlab_code is the primary surface for get_param / set_param calls
  # and for save_system.
  - evaluate_matlab_code
  # detect_matlab_toolboxes verifies toolbox installation (Workflow Step 1).
  - detect_matlab_toolboxes
  # get_mbdt_board_init reads the live board-init sequence before any insert (Workflow Step 5).
  - get_mbdt_board_init
  # set_mbdt_board_init inserts a Custom component into mbdt_board_init.c (Workflow Step 6).
  - set_mbdt_board_init

requires-skills:
  - configuring-mbdt-blocks
  - editing-mbdt-board-init
  - setting-mbdt-target-mcu
  - opening-mbdt-config-tool

reference-files: []

requires-products:
  - Simulink
  - Embedded Coder
  - NXP Model-Based Design Toolbox

toolkit: mbdt-agentic-toolkit
