# manifest.yaml -- Tooling metadata for configuring-mbdt-blocks
schema_version: 1

license: LA_OPT_Online Code Hosting NXP_Software_License

scope: nxp-mbdt-cross-platform

version: "1.0.0"

matlab-release: ">=R2024b"

requires-tools:
  # Primary surface: native Simulink get_param / set_param via evaluate_matlab_code.
  - evaluate_matlab_code
  # get_mbdt_toolbox(family, 'blocks') is the runtime block-availability discovery.
  - get_mbdt_toolbox
  # detect_matlab_toolboxes verifies the MBDT family toolbox is installed (Workflow Step 2).
  - detect_matlab_toolboxes
  # nxp_s32ct_inspect confirms the driver component is declared in the .mex (Workflow Step 4).
  - nxp_s32ct_inspect
  # model_edit is the fallback for structural edits (adding a block to the model).
  - model_edit
  # get_mbdt_board_init / set_mbdt_board_init are used by the per-peripheral references
  # (CAN, UART, I2C, LIN) to read and edit the board initialization sequence.
  - get_mbdt_board_init
  - set_mbdt_board_init

requires-skills:
  # building-simulink-models is the fallback when a block must be added
  # to the model (a structural edit), which uses model_edit.
  - building-simulink-models
  - editing-mbdt-board-init
  - opening-mbdt-config-tool
  - opening-mbdt-example
  - setting-mbdt-model-params
  - setting-mbdt-target-mcu

reference-files:
  # Per-peripheral deep-dive references, loaded before configuring the
  # matching peripheral (see the References section of SKILL.md).
  - reference/can.md
  - reference/uart.md
  - reference/i2c.md
  - reference/lin.md
  - reference/spi.md
  - reference/adc.md
  - reference/pwm.md
  - reference/gpt.md
  - reference/dio.md
  - reference/icu.md
  - reference/freemaster.md
  - reference/profiler.md
  # Skeleton for authoring a new per-peripheral reference (see References section).
  - reference/_template.md

requires-products:
  - Simulink
  - Embedded Coder
  # The family-specific MBDT toolbox is required at runtime; this skill
  # resolves the family dynamically, so the product is named generically.
  # The Workflow's toolbox-installed check enforces it live.
  - NXP Model-Based Design Toolbox


toolkit: mbdt-agentic-toolkit
